name = "doomcss"
main = "worker/index.js"
compatibility_date = "2025-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"

[build]
command = "npm run build"

# ── Network DM signaling — one Durable Object per room, ephemeral ──
# Holds WebSockets from master + joining remotes, relays WebRTC
# offer / answer / ICE candidates between them. No persistent storage
# (pure in-memory state inside the DO). Uses the Hibernation API so
# idle WebSockets don't accrue compute duration billing.

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# ── Cloudflare Realtime TURN credentials ─────────────────────────────
# CLOUDFLARE_TURN_TOKEN_ID identifies the TURN key project on our
# Cloudflare account. Public — pairs with the API token to mint ICE
# servers; useless on its own.
#
# CLOUDFLARE_TURN_API_TOKEN is the bearer token Cloudflare's mint API
# requires. SECRET — anyone holding it can mint credentials against
# our account. Configured in two places:
#   - Local dev (`wrangler dev`): `.dev.vars` file, KEY=value format,
#     gitignored.
#   - Deployed environments: per-environment Wrangler secret —
#       wrangler secret put CLOUDFLARE_TURN_API_TOKEN
#       wrangler secret put CLOUDFLARE_TURN_API_TOKEN --env staging
# The Worker reads it via env and never echoes it to clients; the
# short-lived username + password it mints are what the browser sees.

[vars]
CLOUDFLARE_TURN_TOKEN_ID = "3c7f46486f19ef0b60f1118a56aabe50"

# ── Staging environment ──────────────────────────────────────────────
# Deployed as a separate Worker named `doomcss-staging`. Inherits the
# top-level `main`, `compatibility_date`, `build`, and `migrations`.
# Has its own assets binding and DO binding — meaning DO state in
# staging is completely isolated from production. A room created in
# staging does NOT exist in production, and vice versa.
#
# Deploy: `wrangler deploy --env staging`
# URL:    `dm.cssdoom.wtf` (custom domain — Cloudflare auto-provisions
#         DNS + cert on first deploy as long as cssdoom.wtf is on the
#         same Cloudflare account). Also reachable via
#         `doomcss-staging.<account>.workers.dev` for ad-hoc debugging.

[env.staging]
name = "doomcss-staging"
# Keep the auto-assigned `doomcss-staging.<account>.workers.dev`
# URL alive alongside the custom domain — without this, wrangler
# disables workers.dev on every deploy. Useful as an ad-hoc
# debugging URL when the custom domain DNS / cert provisioning is
# delayed or misbehaving.
workers_dev = true

[env.staging.assets]
directory = "./dist"
binding = "ASSETS"

[[env.staging.durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[env.staging.vars]
CLOUDFLARE_TURN_TOKEN_ID = "3c7f46486f19ef0b60f1118a56aabe50"

[[env.staging.routes]]
pattern = "dm.cssdoom.wtf"
custom_domain = true
